stages:
  - test
  - validate
  - build
  - deploy

python-tests:
  stage: test
  image: python:3.14-slim
  script:
    - pip install --no-cache-dir -r app/requirements-dev.txt
    - python -m pytest -q app/test_main.py

helm-lint:
  stage: validate
  image:
    name: alpine/helm:3.20.2
    entrypoint: [""]
  script:
    - helm lint helm

terraform-validate:
  stage: validate
  image:
    name: hashicorp/terraform:1.16.5
    entrypoint: [""]
  script:
    - terraform -chdir=terraform fmt -check -recursive
    - terraform -chdir=terraform init -backend=false
    - terraform -chdir=terraform validate

container-build:
  stage: build
  image:
    name: moby/buildkit:v0.33.1-rootless
    entrypoint: [""]
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  script:
    - |
      mkdir -p ~/.docker
      AUTH="$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')"
      printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$CI_REGISTRY" "$AUTH" > ~/.docker/config.json
    - buildctl-daemonless.sh build --frontend dockerfile.v0 --local context=. --local dockerfile=. --output "type=image,name=$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA,push=true"
  rules:
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

deploy:
  stage: deploy
  image:
    name: alpine/helm:3.20.2
    entrypoint: [""]
  needs:
    - container-build
    - helm-lint
  environment:
    name: production
  variables:
    KUBE_NAMESPACE: production
  script:
    - test -n "$KUBE_CONFIG" || (echo "KUBE_CONFIG must be configured as a GitLab file-type CI/CD variable" >&2; exit 1)
    - export KUBECONFIG="$KUBE_CONFIG"
    - helm upgrade --install myapp helm --namespace "$KUBE_NAMESPACE" --create-namespace --set-string image.repository="$CI_REGISTRY_IMAGE" --set-string image.tag="$CI_COMMIT_SHORT_SHA" --set-string environment=production
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
